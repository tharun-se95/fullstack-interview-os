name: AI practice starter tests
on:
  push:
    paths:
      - 'ai-lab-starter/**'
      - '.github/workflows/ai-lab-tests.yml'
  pull_request:
    paths:
      - 'ai-lab-starter/**'
      - '.github/workflows/ai-lab-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run deterministic tests
        working-directory: ai-lab-starter
        run: npm test
      - name: Run the offline retrieval demo
        working-directory: ai-lab-starter
        run: npm run demo
