services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fullstack_os
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_pw
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d fullstack_os"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgres://app:local_dev_pw@db:5432/fullstack_os
      DEV_API_TOKEN: change-me-local-only
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
